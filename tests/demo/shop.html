<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enamel Kettle, 1.5 l - Harbour &amp; Co.</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #1d2433; background: #f6f3ee; }
  header { display: flex; align-items: center; gap: 28px; padding: 14px 40px; background: #17324d; color: #fff; }
  header b { font-size: 19px; letter-spacing: .3px; }
  header nav { display: flex; gap: 22px; font-size: 14px; opacity: .85; }
  header .basket { margin-left: auto; font-size: 14px; opacity: .85; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 44px; max-width: 800px; margin: 34px auto; padding: 0 24px; }
  .photo { height: 300px; border-radius: 18px; background: linear-gradient(160deg, #dfeaf3, #c3d6e6); display: grid; place-items: center; }
  .crumbs { color: #6c7486; font-size: 13px; }
  h1 { margin: 6px 0 4px; font-size: 30px; line-height: 1.2; }
  .rating { color: #6c7486; font-size: 13px; }
  .buy { margin: 40px 0 14px; }
  #price { font-size: 34px; font-weight: 700; color: #17324d; }
  .was { margin-left: 10px; color: #8a90a0; }
  .stock { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; background: #e3f6ea; color: #0b6b38; font-weight: 600; font-size: 13px; }
  .add { display: inline-block; margin-top: 16px; padding: 11px 26px; border-radius: 10px; background: #e2632c; color: #fff; font-weight: 700; }
  .desc { margin-top: 16px; color: #3d4557; max-width: 380px; }
</style>
</head>
<body>
<header>
  <b>Harbour &amp; Co.</b>
  <nav><span>Kitchen</span><span>Garden</span><span>Workshop</span><span>Sale</span></nav>
  <span class="basket">Basket (0)</span>
</header>
<main>
  <div class="photo">
    <svg width="190" height="190" viewBox="0 0 190 190" aria-hidden="true">
      <path d="M52 78h86l10 78a10 10 0 0 1-10 11H52a10 10 0 0 1-10-11z" fill="#2f6f9f"/>
      <path d="M58 78c4-20 20-30 37-30s33 10 37 30z" fill="#3a82b8"/>
      <rect x="86" y="36" width="18" height="14" rx="6" fill="#17324d"/>
      <path d="M138 96c22-6 34-18 40-38l-12-4c-4 14-13 22-30 27z" fill="#2f6f9f"/>
      <path d="M44 92C20 88 14 120 40 132" fill="none" stroke="#17324d" stroke-width="9" stroke-linecap="round"/>
      <path d="M62 100c0 18 2 34 6 50" fill="none" stroke="#7fb4dc" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    </svg>
  </div>
  <div>
    <div class="crumbs">Kitchen / Kettles</div>
    <h1>Enamel Kettle, 1.5 l</h1>
    <div class="rating">4.7 out of 5, 212 reviews</div>
    <div class="buy">
      <div><span id="price">{{price}}</span><span class="was">{{was}}</span></div>
      <span class="stock">{{stock}}</span>
    </div>
    <span class="add">Add to basket</span>
    <p class="desc">A sturdy enamel kettle for gas, electric and induction hobs. The handle stays cool, the whistle does not.</p>
  </div>
</main>
</body>
</html>
